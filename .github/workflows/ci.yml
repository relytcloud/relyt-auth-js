name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from "packageManager" in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      # vitest 5 requires Node 22+, so on Node 20 the suite is replaced by a smoke test of the built package.
      - name: Test
        if: matrix.node != 20
        run: pnpm test
      - run: pnpm run build
      - name: Smoke-test the built entries (Node 20)
        if: matrix.node == 20
        run: |
          node --input-type=module -e '
            const a = await import("@relyt/auth");
            const n = await import("@relyt/auth/next");
            for (const k of ["createVerifier", "verifyToken", "createAuthClient", "completeSocialSignIn", "RelytAuthError"]) if (typeof a[k] !== "function") throw new Error(k);
            for (const k of ["createAuthMiddleware", "getClaims", "setTokenCookie", "clearTokenCookie"]) if (typeof n[k] !== "function") throw new Error(k);
            console.log("ok");'
      - name: Check package contents
        run: |
          npm pack --dry-run --json > pack.json
          node -e '
            const [p] = require("./pack.json");
            const files = p.files.map((f) => f.path).sort();
            console.log(files.join("\n"));
            const bad = files.filter((f) => !/^(dist\/.+\.(js|d\.ts)|package\.json|README\.md|LICENSE|CHANGELOG\.md)$/.test(f));
            if (bad.length) { console.error("unexpected files:", bad); process.exit(1); }
            for (const f of ["dist/index.js", "dist/index.d.ts", "dist/next.js", "dist/next.d.ts", "LICENSE", "README.md"]) {
              if (!files.includes(f)) { console.error("missing:", f); process.exit(1); }
            }'
